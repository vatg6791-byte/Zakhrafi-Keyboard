name: Build Zakhrafi iOS
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show Xcode project information
        run: |
          xcodebuild -list \
            -project ZakhrafiKeyboard.xcodeproj
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -project ZakhrafiKeyboard.xcodeproj \
            -scheme ZakhrafiKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Locate built application
        run: |
          echo "Searching build output..."
          find "$PWD/build" \
            -type d \
            -name "*.app" \
            -print
          echo "Searching Xcode build products..."
          find "$PWD/build/Build/Products" \
            -maxdepth 2 \
            -type d \
            -name "*.app" \
            -print
      - name: Package app
        run: |
          set -e
          PRODUCTS="$PWD/build/Build/Products"
          if [ ! -d "$PRODUCTS" ]; then
            echo "ERROR: Xcode build products directory is missing."
            exit 1
          fi
          APP_PATH=""
          for APP_NAME in \
            "Zakhrafi.app" \
            "ZakhrafiKeyboard.app"
          do
            APP_PATH=$(find "$PRODUCTS" \
              -type d \
              -name "$APP_NAME" \
              -print -quit)
            if [ -n "$APP_PATH" ]; then
              break
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Main application bundle was not found."
            echo "All available app bundles:"
            find "$PWD/build" -type d -name "*.app" -print
            exit 1
          fi
          echo "Application found: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -r \
            ZakhrafiKeyboard-unsigned.ipa \
            Payload
          echo "IPA packaging completed."
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZakhrafiKeyboard-unsigned-IPA
          path: ZakhrafiKeyboard-unsigned.ipa
          if-no-files-found: error
