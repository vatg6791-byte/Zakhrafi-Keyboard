
name: Build Zakhrafi iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project ZakhrafiKeyboard.xcodeproj \
            -scheme ZakhrafiKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Zakhrafi.app Payload/
          zip -r ZakhrafiKeyboard-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZakhrafiKeyboard-unsigned-IPA
          path: ZakhrafiKeyboard-unsigned.ipa
